# BlackAnnin's Statistics — Forge 1.20.1 移植版构建属性
# Gradle 内存与并行
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# ForgeGradle 7 官方 MDK 默认属性
net.minecraftforge.gradle.merge-source-sets=true

# ---- Minecraft / Forge 版本 ----
minecraft_version=1.20.1
# 一个 jar 覆盖 [1.20.1,1.20.2)（Forge 官方 47.x 线，1.20.1 全线兼容）
minecraft_version_range=[1.20.1,1.20.2)
forge_version=47.4.29
forge_version_range=[47,)
loader_version_range=[47,)
# 官方映射（Mojang）
mapping_channel=official
mapping_version=1.20.1

# ---- 模组属性 ----
mod_id=blackannins_statistics
mod_name=BlackAnnin's Statistics
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.blackannin.statistics
mod_authors=BlackAnnin
mod_description=Local game statistics: play time, blocks, kills, item usage. Client-side only, data never leaves the machine.
