# BlackAnnin's Statistics — Forge 1.20.2-1.20.4 移植版构建属性
# Gradle 内存与并行
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# ForgeGradle 7 官方 MDK 默认属性
net.minecraftforge.gradle.merge-source-sets=true

# ---- Minecraft / Forge 版本 ----
minecraft_version=1.20.4
# 一个 jar 覆盖 [1.20.2,1.20.5)（1.20.2-1.20.4 客户端 API 同族，Forge 48/49 双加载器版本兼容）
minecraft_version_range=[1.20.2,1.20.5)
forge_version=49.2.13
forge_version_range=[48,)
loader_version_range=[48,)
# 官方映射（Mojang）
jar_tag=1.20.2-1.20.4
mapping_channel=official
mapping_version=1.20.4

# ---- 模组属性 ----
mod_id=blackannins_statistics
mod_name=BlackAnnin's Statistics
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.blackannin.statistics
mod_authors=BlackAnnin
mod_description=Local game statistics: play time, blocks, kills, item usage. Client-side only, data never leaves the machine.
