plugins {
    id 'java-library'
    // MC 26.2 起停止混淆（官方类名即运行时类名）：使用 net.fabricmc.fabric-loom，
    // 无需 mappings，依赖直接 implementation（无重映射管线）。
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = "${mod_version}+${version_suffix}"
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang requires Java 25 for MC 26.2, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

repositories {
    // 国内通用镜像（零散依赖兜底；loom 会自动注入 Mojang / Fabric 官方仓库）
    maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    // 与 NeoForge 主版本使用同一套 Mojmap 官方映射：
    // 平台无关层（stat/storage/session/query/ui）源码可直接复用，无需改类名
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // 纯 Java 核心层（stat/session 数据结构）的单元测试。
    // 与主版本同源：固定为 libs/test 下的本地 jar（JUnit 5.11.3 / Gson 2.11.0）
    testImplementation fileTree('libs/test') { include '*.jar' }

    // @Nullable 注解（javax.annotation）：NeoForge 环境自带，Fabric 环境缺省提供，
    // 保证平台无关层源码与主版本逐字节一致（仅编译期，不进产物）
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
}
