// 预热 IDEA 同步所需的 sources/javadoc 分类器工件到共享 Gradle 缓存（modules-2）。
// 用法：gradlew -I <此文件路径> warmIdeDocs
// 原理：遍历 compile/runtime classpath 的全部已解析模块，逐个以 sources/javadoc
// 分类器建立 detached configuration 强制解析下载；缺失分类器的依赖静默跳过。
rootProject {
    def proj = project
    tasks.register('warmIdeDocs') {
        group = 'ide'
        description = 'Pre-download sources/javadoc classifier artifacts for IDEA sync'
        doLast {
            def seen = new HashSet()
            int fetched = 0
            [proj.configurations.runtimeClasspath, proj.configurations.compileClasspath].each { cfg ->
                cfg.resolvedConfiguration.resolvedArtifacts.each { art ->
                    def id = art.moduleVersion.id
                    def key = "${id.group}:${id.name}:${id.version}"
                    if (seen.add(key)) {
                        ['sources', 'javadoc'].each { cls ->
                            try {
                                def dc = proj.configurations.detachedConfiguration(
                                        proj.dependencies.create("${id.group}:${id.name}:${id.version}:${cls}@jar"))
                                dc.files.each { f -> fetched++ }
                            } catch (Throwable ignored) {
                                // 无 sources/javadoc 分类器的依赖，静默跳过
                            }
                        }
                    }
                }
            }
            println "IDE 文档预热完成: ${seen.size()} 个依赖 / ${fetched} 个分类器工件已入缓存"
        }
    }
}
