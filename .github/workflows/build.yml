name: Build

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: blackanninsstatistics-template-1.21.1, java: '21' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-1.21.3, java: '21' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-1.21.4, java: '21' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-1.21.5, java: '21' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-1.21.6, java: '21' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-1.21.7, java: '21' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-1.21.8, java: '21' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-1.21.9, java: '21' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-1.21.10, java: '21' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-1.21.11, java: '21' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-26.1, java: '25' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-26.2, java: '25' }
          - { project: neoforge-ports/blackanninsstatistics-neoforge-26.3, java: '25' }
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ matrix.java }}'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x "${{ matrix.project }}/gradlew"

      - name: Build ${{ matrix.project }}
        working-directory: ${{ matrix.project }}
        run: ./gradlew build --no-daemon
