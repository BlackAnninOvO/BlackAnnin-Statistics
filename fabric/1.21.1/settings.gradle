pluginManagement {
    repositories {
        // Fabric 官方 maven（loom 插件与 fabric-api，直连可达）
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        // 国内通用镜像（foojay/junit 等零散插件）
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'fabric-blackannins-statistics-1.21.1'
