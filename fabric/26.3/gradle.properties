org.gradle.jvmargs=-Xmx2G
# Loom 1.19.4 要求 Gradle 守护进程运行在 JVM 25+（编译目标仍由各项目 java 工具链决定）。
# 固定使用本机 Zulu 25：IDEA 同步与 CLI 构建均依赖此属性（迁移机器时可改/删）。
org.gradle.java.home=C:/Program Files/Zulu/zulu-25
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Fabric Properties（https://fabricmc.net/develop）
# 编译目标 Minecraft 版本
minecraft_version=26.3
# Fabric Loader（与官方示例模板一致：0.20.x 稳定线）
loader_version=0.20.1
# Fabric Loom（1.19 稳定线最新版，锁定可复现构建）
loom_version=1.19.4
# Fabric API：1.21.1 最新构建
fabric_api_version=0.166.2+26.3

## Mod Properties
mod_id=blackannins_statistics
mod_name=BlackAnnin's Statistics
mod_license=MIT
mod_version=1.0.0
mod_group_id=com.blackannin.statistics
# 产物版本后缀：jar 文件名带加载器与 MC 版本标识，避免与其他加载器产物冲突
version_suffix=fabric-26.3
