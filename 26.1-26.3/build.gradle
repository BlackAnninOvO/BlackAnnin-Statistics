// BlackAnnin's Statistics — Forge 26.1-26.3 移植版
// 基于 Forge 官方 MDK 1.20.1-47.4.29 模板（ForgeGradle 7 + renamer）。
// 说明：Forge 官方模板即此结构；构建目标 26.3（Java 25）。

plugins {
    id 'eclipse'
    id 'idea'
    id 'java'
    id 'net.minecraftforge.gradle' version '[7.0,8)'
}

version = mod_version
group = mod_group_id

base {
    // 产物 jar：blackannins_statistics-forge-1.20.1-1.0.0.jar（加载器+版本范围标识，防多加载器产物混淆）
    archivesName = "${mod_id}-forge-${jar_tag}"
}

// Mojang 在 1.20.1 附带 Java 17，模组以 Java 17 为目标。
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    // 官方映射（Mojang official）
    mappings channel: mapping_channel, version: minecraft_version

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
        }

        register('client') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('server') {
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')
            args '--mod', mod_id, '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven          // maven.minecraftforge.net（本机直连可达）
    maven fg.minecraftLibsMaven  // libraries.minecraft.net
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:$minecraft_version-$forge_version")

    // 纯 Java 核心层（stat/session 数据结构）的单元测试。
    // 与主工程一致：使用仓库内 libs/test 本地 jar（JUnit 5.11.3 / Gson 2.11.0），不依赖在线仓库。
    testImplementation fileTree('libs/test') { include '*.jar' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// 26.x 运行时已是官方映射（无 SRG），无需 renamer 重映射。
tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors
        ])
    }
}

idea.module { downloadJavadoc = downloadSources = true }
